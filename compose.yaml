
services:
  postgres:
    image: postgres:17
    container_name: ledgerpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerpay
      POSTGRES_USER: ledgerpay_user
      POSTGRES_PASSWORD: ${LEDGERPAY_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ledgerpay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerpay_user -d ledgerpay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ledgerpay_postgres_data:
