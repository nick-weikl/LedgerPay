
spring.application.name=ledgerpay

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5433/ledgerpay
spring.datasource.username=ledgerpay_user
spring.datasource.password=${LEDGERPAY_DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080
